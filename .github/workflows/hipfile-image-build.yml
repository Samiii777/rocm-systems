name: new_CI_image
run-name: Build the Docker image for hipFile CI

env:
  AIS_INPUT_ROCM_VERSION: ${{ inputs.rocm_version }}
  AIS_PR_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/pull

on:
  workflow_call:
    inputs:
      ci_image_name:
        description: "Full CI image name & tag to build/push"
        required: true
        type: string
      ci_image_cache:
        description: "Full CI cache image name & tag for Docker build cache"
        required: true
        type: string
      ci_images:
        description: "JSON map of platform-version to image names (passed through as output)"
        required: true
        type: string
      platform:
        required: true
        type: string
      rocm_version:
        description: "Target ROCm MAJOR.MINOR.PATCH Version"
        required: true
        type: string
    outputs:
      ci_image:
        description: "The full name & tag of the CI image to use."
        value: ${{ inputs.ci_image_name }}
      ci_image_build_satisfied:
        description: |
          Indicates if the CI image is in an acceptable state.
          Set to 'true' if the CI image is unchanged, or if a new CI image was
          built successfully. Otherwise 'false'.
        value: >-
          ${{
            (
              !inputs.dockerfile_changed &&
              jobs.build_AIS_image.result == 'skipped'
            ) ||
            (
              inputs.dockerfile_changed &&
              jobs.build_AIS_image.result == 'success'
            )
          }}
      ci_images:
        description: "Passthrough of ci_images JSON map for downstream consumers."
        value: ${{ inputs.ci_images }}

permissions:
  contents: read
  packages: write

jobs:

  build_AIS_image:
    runs-on: [ubuntu-24.04]
    container: docker:28.5
    steps:
      - name: Set CI environment variables
        run: |
          echo "AIS_PR_NUMBER=$(echo "${GITHUB_REF}" | sed 's|[^0-9]||g')" >> "${GITHUB_ENV}"

      - name: Fetching code repository...
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          sparse-checkout: |
            projects/hipfile
            .github/workflows

      - name: Authenticating to GitHub Container Registry.
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Builder
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          name: ais-builder
          driver: docker-container
          cache-binary: false # True uses the GHA Cache Backend

      - name: Build base image for AIS CI
        run: |
          docker buildx build \
            -f "${GITHUB_WORKSPACE}/projects/hipfile/util/docker/DOCKERFILE.ais_ci_${{ inputs.platform }}" \
            --label "org.opencontainers.image.description= \
              ais_ci_${{ inputs.platform }} Development Image for AIS CI using branch \
              ${GITHUB_HEAD_REF} for PR #${AIS_PR_NUMBER}. \
              PR URL: ${AIS_PR_BASE_URL}/${AIS_PR_NUMBER}" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg ROCM_VERSION=${AIS_INPUT_ROCM_VERSION} \
            --cache-from=type=registry,ref="${{ inputs.ci_image_name }}" \
            --cache-from=type=registry,ref="${{ inputs.ci_image_cache }}" \
            --push \
            -t "${{ inputs.ci_image_name }}" \
            "${GITHUB_WORKSPACE}/projects/hipfile/util/docker"
