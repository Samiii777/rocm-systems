name: hipfile-toplevel
run-name: Kicks off several hipFile CI workflows for various platforms

on:
  pull_request:
    types: [opened, synchronize, reopened] # Defaults
    paths:
      - 'projects/hipfile/**'
      - '.github/workflows/hipfile-*.yml'
      - '!**/*.md'
      - '!**/*.rst'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:

  AIS_CI_Pre-check:
    runs-on: [ubuntu-24.04]
    outputs:
      changed_dockerfile: ${{ steps.ci-flags.outputs.changed_dockerfile }}
      ci_images: ${{ steps.ci-images.outputs.ci_images }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Fetching code repository...
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          path: rocm-systems
          sparse-checkout: |
            projects/hipfile
            .github/workflows
      - name: Git fetch base ref
        working-directory: rocm-systems
        run: git fetch origin "${GITHUB_BASE_REF}"
      - name: Set CI Flags
        working-directory: rocm-systems/projects/hipfile
        id: ci-flags
        run: |
          echo "changed_dockerfile=$(./util/files-changed.sh "origin/${GITHUB_BASE_REF}" HEAD 'projects/hipfile/util/docker/DOCKERFILE.*')" >> "${GITHUB_OUTPUT}"
      - name: Compute matrix configuration
        id: matrix
        run: |
          echo 'matrix={"supported_platforms":["rocky","suse","ubuntu"],"rocm_versions":["7.2.2"]}' >> "${GITHUB_OUTPUT}"
      - name: Compute CI image names
        id: ci-images
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}/hipfile
          CHANGED: ${{ steps.ci-flags.outputs.changed_dockerfile }}
        run: |
          JSON='{}'
          for platform in rocky suse ubuntu; do
            for version in 7.2.2; do
              if [ "${CHANGED}" = "1" ]; then
                tag="$(echo "${GITHUB_REF}" | sed 's|[^a-zA-Z0-9]|-|g')-rocm${version}"
              else
                tag="latest-rocm${version}"
              fi
              key="${platform}-${version}"
              img="${REGISTRY}/ais_ci_${platform}:${tag}"
              img="$(printf '%s' "${img}" | tr '[:upper:]' '[:lower:]')"
              cache="${REGISTRY}/ais_ci_${platform}:latest-rocm${version}-cache"
              cache="$(printf '%s' "${cache}" | tr '[:upper:]' '[:lower:]')"
              JSON=$(echo "${JSON}" | jq -c \
                --arg k "${key}" \
                --arg img "${img}" \
                --arg cache "${cache}" \
                '. + {($k): {"ci_image": $img, "ci_image_cache": $cache}}')
            done
          done
          echo "ci_images=${JSON}" >> "${GITHUB_OUTPUT}"

  build_AIS_CI_image:
    needs: AIS_CI_Pre-check
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.AIS_CI_Pre-check.outputs.matrix) }}
    uses: ./.github/workflows/hipfile-image-build.yml
    with:
      ci_image_name: ${{ fromJSON(needs.AIS_CI_Pre-check.outputs.ci_images)[format('{0}-{1}', matrix.supported_platforms, matrix.rocm_versions)].ci_image }}
      ci_image_cache: ${{ fromJSON(needs.AIS_CI_Pre-check.outputs.ci_images)[format('{0}-{1}', matrix.supported_platforms, matrix.rocm_versions)].ci_image_cache }}
      ci_images: ${{ needs.AIS_CI_Pre-check.outputs.ci_images }}
      dockerfile_changed: ${{ needs.AIS_CI_Pre-check.outputs.changed_dockerfile == '1' }}
      platform: ${{ matrix.supported_platforms }}
      rocm_version: ${{ matrix.rocm_versions }}

  hipfile-CI:
    if: >-
      ${{
        !cancelled() && (
          needs.build_AIS_CI_image.result == 'success' ||
          needs.build_AIS_CI_image.result == 'skipped'
        )
      }}
    needs: [AIS_CI_Pre-check, build_AIS_CI_image]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.AIS_CI_Pre-check.outputs.matrix) }}
    uses: ./.github/workflows/hipfile-ci.yml
    with:
      ci_image: ${{ fromJSON(needs.AIS_CI_Pre-check.outputs.ci_images)[format('{0}-{1}', matrix.supported_platforms, matrix.rocm_versions)].ci_image }}
      platform: ${{ matrix.supported_platforms }}
      rocm_version: ${{ matrix.rocm_versions }}
